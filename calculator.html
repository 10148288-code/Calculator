<!DOCTYPE html>
<!-- This code was provided as starter code by my teacher. -->
<!-- AI used to partially wtrite code and fix errors--> 
<!--AI fully write Style part of the code-->
<html>
  
<head>
   <title>Alpine.js Calculator</title>
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"> </script>
   <style>
       body {
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
           margin: 0;
           min-height: 100vh;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
           color: #333;
       }
       header h2 {
           color: #ffffff;
           text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
           text-align: center;
           margin-bottom: 20px;
       }
       .calculator-box {
           background-color: rgba(255, 255, 255, 0.95);
           padding: 30px;
           border-radius: 16px;
           width: 100%;
           max-width: 400px;
           box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
           box-sizing: border-box;
       }
       label {
           font-weight: 600;
           font-size: 0.9em;
           color: #4a5568;
       }
       input[type="text"], select {
           width: 100%;
           padding: 12px;
           margin-top: 8px;
           margin-bottom: 10px;
           border: 2px solid #e2e8f0;
           border-radius: 8px;
           box-sizing: border-box;
           font-size: 1em;
           transition: border-color 0.3s;
       }

       input[type="text"]:focus, select:focus {
           outline: none;
           border-color: #667eea;
       }
       .result {
           margin-top: 20px;
           padding: 15px;
           background-color: #ebf4ff;
           border-left: 5px solid #667eea;
           border-radius: 8px;
           font-weight: bold;
           font-size: 1.2em;
           color: #2b6cb0;
           text-align: center;
       }
       footer {
           margin-top: 30px;
           text-align: center;
           color: rgba(255, 255, 255, 0.8);
           font-size: 0.85em;
           line-height: 1.5;
       }
   </style>
</head>


<body>
   <header>
      <h2>Calculator</h2>
   </header>
   <div class="calculator-box" x-data="webApp">
       
       <!-- First Number Input -->
       <div>
         <label for="num1">First Number:</label>
         <div>
             <input type="text" x-model="numInput[0]" placeholder="Start typing...">
         </div>
       </div>

       <br>

       <!-- Second Number Input -->
       <div>
         <label for="num2">Second Number:</label>
         <div>
             <input type="text" x-model="numInput[1]" placeholder="Start typing...">
         </div>
       </div>

       <br>

       <!-- Operator Selection DropDown Menu -->
       <div>
         <label for="operator-dropdown">Choose your operator for calculation:</label>
         <div>
             <select x-model="operator">
               <option value="">-- Select --</option>
               <option value="Addition">Addition</option>
               <option value="Substraction">Substraction</option>
               <option value="Multiplication">Multiplication</option>
               <option value="Division">Division</option>

             </select>
         </div>
       </div>

       <!-- Result Display -->
       <div class="result">
           <p>Result: <span x-text="calculate()"></span></p>
       </div>
   </div>
   
   <br>
  
  <footer>
      <p>© 2026-2027<br>
      AP Computer Science Principles<br>
      George Washington High School</p>
  </footer>
  
  <script>
         document.addEventListener('alpine:init', () => {
             Alpine.data('webApp', () => ({
                 // list for storing numbers unputs
              numInput: ['', ''],
             
                 // store operator
                 operator: '',

                 // calculating result based on the choosen inputs
                 calculate() {
                     // strings to numbers converting 
                     let num1 = parseFloat(this.numInput[0]);
                     let num2 = parseFloat(this.numInput[1]);

                     // actuall math operations
                     if (this.operator === 'Addition') {
                         return num1 + num2;
                     } else if (this.operator === 'Substraction') {
                         return num1 - num2;
                     }else if (this.operator === 'Multiplication') {
                         return num1 * num2;
                     }else if (this.operator === 'Division') {
                         return num1 / num2;
                     }
                 }
            }));
         });
   </script>
</body>
</html>
